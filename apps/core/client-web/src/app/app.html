<!--
  First focusable element on the page: it lets a keyboard reader skip the side navigation, which
  otherwise has to be walked in full on every page change. Visible only while focused.
-->
<a class="skip-link" href="#main-content">{{ 'COMMON.SKIP_TO_CONTENT' | translate }}</a>

<app-offline-banner></app-offline-banner>
<router-outlet />

@if (loaderService.isLoading('global')()) {
  <!-- <app-loader [overlay]="true"></app-loader> -->
}

@if (modalService.isOpen() && modalService.options(); as options) {
  <app-modal 
    [options]="options"
    (closed)="modalService.close(null)"
    (confirmed)="modalService.close(true)"
    (cancelled)="modalService.close(false)"
  />
}

<app-geo-mismatch-modal></app-geo-mismatch-modal>

<app-toast-container></app-toast-container>
