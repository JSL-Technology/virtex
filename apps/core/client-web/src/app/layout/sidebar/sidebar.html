<nav class="sidebar" [attr.aria-label]="'SHELL.MODULE_PANEL' | translate">
  @if (module(); as active) {
    <h2 class="module-title">{{ active.titleKey | translate }}</h2>
  }

  <div class="sidebar-body">
    @for (section of sections(); track section.group) {
      <div class="menu-group">
        <h3 class="group-title">{{ section.labelKey | translate }}</h3>

        @for (entry of section.entries; track entry.path) {
          <a
            class="menu-item"
            [routerLink]="entry.path"
            [class.active]="entry.path === activeEntry()"
            [attr.aria-current]="entry.path === activeEntry() ? 'page' : null"
          >
            <lucide-icon [img]="entry.icon" size="16" class="item-icon" aria-hidden="true"></lucide-icon>
            <span class="label">{{ entry.labelKey | translate }}</span>
          </a>
        }
      </div>
    } @empty {
      <p class="menu-empty">{{ 'SHELL.NO_ENTRIES' | translate }}</p>
    }
  </div>
</nav>
