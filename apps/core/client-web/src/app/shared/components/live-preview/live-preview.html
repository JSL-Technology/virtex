<div class="preview-container">
    <div class="preview-header">
        <div class="logo-placeholder">{{ 'shared.live_preview.tu_logo' | translate }}</div>
        <div class="nav-placeholder">{{ 'shared.live_preview.dashboard' | translate }}</div>
    </div>
    <div class="preview-content">
        <h4>{{ 'shared.live_preview.sample_card' | translate }}</h4>
        <p>{{ 'shared.live_preview.sample_text_so_you_can_see' | translate }}</p>
        <div class="preview-actions">
            <button class="secondary-button">{{ 'shared.live_preview.cancel' | translate }}</button>
            <button class="primary-button">{{ 'shared.live_preview.ok' | translate }}</button>
        </div>
        <div class="input-field">
            <label for="campo-de-ejemplo">{{ 'shared.live_preview.sample_field' | translate }}</label>
            <input id="campo-de-ejemplo" type="text" [placeholder]="'shared.live_preview.type_here' | translate">
        </div>
    </div>
</div>
