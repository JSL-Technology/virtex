@if (hasInput()) {
  <div class="pw-strength" [ngClass]="levelClass()">
    <div class="pw-meter" role="img" [attr.aria-label]="'password_strength.meter' | translate: { level: labelKey() | translate }">
      <span class="pw-meter-bar" [class.on]="strength() >= 1"></span>
      <span class="pw-meter-bar" [class.on]="strength() >= 2"></span>
      <span class="pw-meter-bar" [class.on]="strength() >= 3"></span>
      <span class="pw-meter-bar" [class.on]="strength() >= 4"></span>
    </div>

    <!-- Empty at level 0: the meter only appears once something has been typed. -->
    <div class="pw-meter-label" aria-hidden="true">
      @if (strength() > 0) {
        {{ labelKey() | translate }}
      }
    </div>

    <ul class="pw-checklist">
      @for (check of checks(); track check.labelKey) {
        <li class="pw-check" [class.met]="check.met">
          <span class="pw-check-icon">
            <lucide-icon [img]="check.met ? CheckIcon : XIcon" size="12"></lucide-icon>
          </span>
          <span class="pw-check-label">{{ check.labelKey | translate: check.labelParams }}</span>
        </li>
      }
    </ul>
  </div>
}
