<!--
  One <svg> per brand, each drawn into the same 40×24 box so the plate stays a constant shape
  whatever network it carries. The marks are approximations of the networks' own artwork, trimmed
  to what still reads at ~32px: the point is instant recognition on the billing screen, not a
  pixel-exact trademark. `unknown` is the generic card and is also the @default, so a brand we have
  no art for never falls through to nothing.
-->
@switch (normalized()) {

  @case ('visa') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <text x="20" y="17" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="13" font-weight="700" font-style="italic" letter-spacing="0.5"
          fill="#1434cb">VISA</text>
  </svg>
  }

  @case ('mastercard') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <circle cx="16" cy="12" r="7" fill="#eb001b" />
    <circle cx="24" cy="12" r="7" fill="#f79e1b" />
    <!-- Lens where the two discs overlap, in the brand's blended orange. -->
    <path d="M20 6.3a7 7 0 0 0 0 11.4 7 7 0 0 0 0-11.4z" fill="#ff5f00" />
  </svg>
  }

  @case ('amex') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect width="40" height="24" rx="3" fill="#006fcf" />
    <text x="20" y="15" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="7.5" font-weight="700" letter-spacing="0.4" fill="#ffffff">AMEX</text>
  </svg>
  }

  @case ('discover') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <text x="19" y="14.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="5.6" font-weight="800" letter-spacing="0.2" fill="#231f20">DISCOVER</text>
    <!-- The orange sphere that sits over the back of the wordmark. -->
    <circle cx="30.5" cy="9.6" r="3.2" fill="#f47216" />
  </svg>
  }

  @case ('diners') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <circle cx="20" cy="12" r="9" fill="#0079be" />
    <circle cx="20" cy="12" r="6.2" fill="#ffffff" />
    <path d="M20 5.8a6.2 6.2 0 0 1 0 12.4z" fill="#0079be" />
    <circle cx="20" cy="12" r="2.4" fill="#ffffff" />
  </svg>
  }

  @case ('jcb') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect x="6.5" y="4" width="9" height="16" rx="2" fill="#0e4c96" />
    <rect x="15.5" y="4" width="9" height="16" rx="2" fill="#e4002b" />
    <rect x="24.5" y="4" width="9" height="16" rx="2" fill="#008456" />
    <text x="11" y="15.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="8" font-weight="700" fill="#ffffff">J</text>
    <text x="20" y="15.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="8" font-weight="700" fill="#ffffff">C</text>
    <text x="29" y="15.5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-size="8" font-weight="700" fill="#ffffff">B</text>
  </svg>
  }

  @case ('unionpay') {
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <path d="M11 4h7l-4 16h-7z" fill="#e21836" />
    <path d="M17 4h7l-4 16h-7z" fill="#00447c" />
    <path d="M23 4h7l-4 16h-7z" fill="#007b84" />
  </svg>
  }

  @default {
  <!-- unknown: a plain card with a magnetic stripe, in a muted ink that reads on the white plate. -->
  <svg viewBox="0 0 40 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <rect x="3" y="5" width="34" height="14" rx="2.5" fill="none" stroke="#9aa0ad" stroke-width="1.6" />
    <rect x="3" y="8.5" width="34" height="3" fill="#9aa0ad" />
  </svg>
  }
}
