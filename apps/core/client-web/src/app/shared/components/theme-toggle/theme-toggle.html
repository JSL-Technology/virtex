<button
  type="button"
  class="theme-toggle"
  [attr.aria-label]="theme.isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
  [attr.title]="theme.isDark() ? 'Activar tema claro' : 'Activar tema oscuro'"
  (click)="toggle()"
>
  <lucide-icon
    [img]="theme.isDark() ? SunIcon : MoonIcon"
    [size]="18"
    aria-hidden="true"
  />
</button>
