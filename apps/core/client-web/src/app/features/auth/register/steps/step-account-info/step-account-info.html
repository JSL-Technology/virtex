<div class="step-container" [formGroup]="group">
  <div class="step-header">
    <h3 class="step-title">{{ 'register.steps.account.title_internal' | translate }}</h3>
    <p class="step-subtitle">{{ 'register.steps.account.details_primary_administrator' | translate }}</p>
  </div>

  <div class="form-grid">
    <app-auth-input
      formControlName="firstName"
      [label]="'register.first_name' | translate"
      [placeholder]="'register.john' | translate"
      [required]="true"
      [hasIcon]="true"
      [errorMessage]="getErrorMessage('firstName')">
      <lucide-icon icon [img]="UserIcon" size="18"></lucide-icon>
    </app-auth-input>

    <app-auth-input
      formControlName="lastName"
      [label]="'register.last_name' | translate"
      [placeholder]="'register.doe' | translate"
      [required]="true"
      [hasIcon]="true"
      [errorMessage]="getErrorMessage('lastName')">
      <lucide-icon icon [img]="UserIcon" size="18"></lucide-icon>
    </app-auth-input>

    <div class="full-width">
      <app-auth-input
        formControlName="email"
        type="email"
        [label]="'register.email' | translate"
        [placeholder]="'register.name_company_com' | translate"
        [required]="true"
        [hasIcon]="true"
        [errorMessage]="getErrorMessage('email')">
        <lucide-icon icon [img]="MailIcon" size="18"></lucide-icon>
      </app-auth-input>
    </div>

    <div class="full-width">
      <!-- The number is collected as (country + national) and stored as E.164, which is what every
           verification and OTP endpoint requires. A free-text `type="tel"` field here sent national
           numbers straight to the API, which rejected them, so phone verification could never pass. -->
      <app-intl-phone-input
        formControlName="phone"
        [label]="'register.phone' | translate"
        [placeholder]="'register.phone_placeholder' | translate">
      </app-intl-phone-input>
    </div>

    <div class="full-width" formGroupName="passwordGroup">
      <div class="password-grid">
        <div class="password-field-wrapper">
          <app-auth-input
            formControlName="password"
            type="password"
            [label]="'register.password' | translate"
            [placeholder]="'register.create_secure_password' | translate"
            [required]="true"
            [hasIcon]="true"
            [errorMessage]="getErrorMessage('passwordGroup.password')">
            <lucide-icon icon [img]="LockIcon" size="18"></lucide-icon>
          </app-auth-input>
        </div>

        <app-auth-input
          formControlName="confirmPassword"
          type="password"
          [label]="'register.confirm_password' | translate"
          [placeholder]="'register.repeat_your_password' | translate"
          [required]="true"
          [hasIcon]="true"
          [errorMessage]="getErrorMessage('passwordGroup.confirmPassword')">
          <lucide-icon icon [img]="LockIcon" size="18"></lucide-icon>
        </app-auth-input>
      </div>

      <app-password-strength [password]="group.get('passwordGroup.password')?.value"></app-password-strength>

      <div *ngIf="group.get('passwordGroup')?.errors?.['passwordMismatch'] && group.get('passwordGroup.confirmPassword')?.touched" class="password-mismatch-error">
         <lucide-icon [img]="AlertCircleIcon" size="14"></lucide-icon>
         <span>{{ 'register.errors.password_mismatch' | translate }}</span>
      </div>
    </div>
  </div>
</div>
