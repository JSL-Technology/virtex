<!--
  ── El lienzo ───────────────────────────────────────────────────────────────
  Cuatro velos de color y dos cintas de seda, todos `aria-hidden`: para un
  lector de pantalla esta pantalla es un formulario, no una obra abstracta.

  Van en elementos propios y no en pseudoelementos del contenedor porque cada
  capa necesita su propia animación, y un elemento solo tiene dos
  pseudoelementos. Además, así cada velo es su propia capa de composición y el
  movimiento lo resuelve la GPU sin repintar el formulario en cada fotograma.
-->
<div class="auth-canvas" [class.auth-canvas--photo]="backgroundImage" aria-hidden="true">
  @if (backgroundImage) {
    <span class="auth-photo" [style.background-image]="'url(' + backgroundImage + ')'"></span>
  } @else {
    <span class="aurora aurora--one"></span>
    <span class="aurora aurora--two"></span>
    <span class="aurora aurora--three"></span>
    <span class="aurora aurora--four"></span>

    <span class="aurora-silk aurora-silk--a"></span>
    <span class="aurora-silk aurora-silk--b"></span>

    <span class="aurora-grid"></span>
  }

  <span class="aurora-veil"></span>
</div>

<div class="auth-shell">
  <header class="auth-topbar">
    @if (showBrand) {
      <a class="auth-brand" href="/" [attr.aria-label]="'AUTH.AUTH_LAYOUT.VIRTEX_ERP' | translate">
        <app-brand-logo [size]="30" [label]="'AUTH.AUTH_LAYOUT.VIRTEX_ERP' | translate"></app-brand-logo>
      </a>
    } @else {
      <span></span>
    }

    <app-theme-toggle class="auth-theme-toggle on-glass"></app-theme-toggle>
  </header>

  <main class="auth-main">
    <div class="auth-card" [class.auth-card--wide]="width === 'wide'">
      <ng-content></ng-content>

      <!-- Acciones proyectadas: el enlace cruzado acceso ↔ registro. -->
      <div class="auth-extra-actions">
        <ng-content select="[footer-actions]"></ng-content>
      </div>
    </div>
  </main>

  <app-auth-footer></app-auth-footer>
</div>
