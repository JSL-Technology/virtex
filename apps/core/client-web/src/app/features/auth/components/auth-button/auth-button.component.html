<button
  [type]="type"
  class="submit-button"
  [ngClass]="'submit-button--' + variant"
  [class.loading]="loading"
  [disabled]="disabled || loading"
  [attr.aria-busy]="loading || null"
  (click)="clicked.emit($event)">

  <!--
    El indicador acompaña al texto, no lo sustituye. Cuando lo sustituía, el
    botón cambiaba de ancho al pulsarlo y el formulario se recomponía justo en
    el instante de máxima atención del usuario. Quien llama decide qué dice la
    etiqueta mientras carga («Iniciando sesión…»).
  -->
  @if (loading) {
    <span class="spinner" aria-hidden="true"></span>
  }

  <span class="btn-content">
    <ng-content select="[icon]"></ng-content>
    <ng-content></ng-content>
  </span>
</button>
