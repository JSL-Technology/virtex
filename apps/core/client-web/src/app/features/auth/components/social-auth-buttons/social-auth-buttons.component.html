<!--
  Icono Y nombre (QA M-14). Eran solo iconos con el nombre en el `aria-label`: un lector de
  pantalla lo anunciaba, pero a la vista un edificio no dice «acceso único de tu empresa». El
  `aria-label` conserva la frase completa («Continuar con Google»); el texto visible es el nombre
  corto, que es lo que se busca con la mirada. La frase CONTIENE el nombre visible —también en el
  SSO— para que quien dicta «pulsa SSO de empresa» llegue al botón (WCAG 2.5.3).
-->
<div class="social-auth-grid">
  <button type="button" (click)="loginWith('google')" class="social-btn" [attr.aria-label]="'auth.social_auth_buttons.sign_in_with_google' | translate">
    <img src="assets/icons/google.svg" alt="" class="social-icon">
    <span class="social-label" aria-hidden="true">{{ 'login.providers.google' | translate }}</span>
  </button>

  <button type="button" (click)="loginWith('microsoft')" class="social-btn" [attr.aria-label]="'auth.social_auth_buttons.sign_in_with_microsoft' | translate">
    <img src="assets/icons/microsoft.svg" alt="" class="social-icon">
    <span class="social-label" aria-hidden="true">{{ 'login.providers.microsoft' | translate }}</span>
  </button>

  <button type="button" (click)="loginWith('sso')" class="social-btn" [attr.aria-label]="'auth.social_auth_buttons.sign_in_with_sso' | translate">
    <svg class="social-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h7a2 2 0 0 1 2 2v16M9 7h2m-2 4h2m-2 4h2m4-8h.01M15 11h.01"
            stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span class="social-label" aria-hidden="true">{{ 'login.providers.sso' | translate }}</span>
  </button>
</div>
