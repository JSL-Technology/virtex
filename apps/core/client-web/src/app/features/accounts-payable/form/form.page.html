<div class="view-container">
  <div class="view-header">
    <a routerLink="/accounts-payable" class="btn-icon">
      <lucide-icon [name]="BackIcon" [size]="24"></lucide-icon>
    </a>
    <h1>{{ (isEditMode() ? 'ACCOUNTS_PAYABLE.FORM.TITLE_EDIT' : 'ACCOUNTS_PAYABLE.FORM.TITLE_CREATE') | translate }}</h1>
  </div>

  <div class="view-content" [formGroup]="form">
    <div class="card">
      <div class="card-header">
        <h2>{{ 'ACCOUNTS_PAYABLE.FORM.INFORMACION_GENERAL' | translate }}</h2>
      </div>
      <div class="card-body grid-form">
        <div class="form-field">
          <label for="supplierId">{{ 'ACCOUNTS_PAYABLE.FORM.PROVEEDOR' | translate }}</label>
          <input type="text" id="supplierId" formControlName="supplierId" [placeholder]="'ACCOUNTS_PAYABLE.FORM.SELECCIONAR_PROVEEDOR' | translate">
        </div>
        <div class="form-field">
          <label for="billNumber">{{ 'ACCOUNTS_PAYABLE.FORM.NUMERO_FACTURA' | translate }}</label>
          <input type="text" id="billNumber" formControlName="billNumber">
        </div>
        <div class="form-field">
          <label for="issueDate">{{ 'ACCOUNTS_PAYABLE.FORM.FECHA_EMISION' | translate }}</label>
          <input type="date" id="issueDate" formControlName="issueDate">
        </div>
        <div class="form-field">
          <label for="dueDate">{{ 'ACCOUNTS_PAYABLE.FORM.FECHA_VENCIMIENTO' | translate }}</label>
          <input type="date" id="dueDate" formControlName="dueDate">
        </div>
      </div>
    </div>

    <div class="card" formArrayName="lineItems">
      <div class="card-header">
        <h2>{{ 'ACCOUNTS_PAYABLE.FORM.DETALLES_FACTURA' | translate }}</h2>
      </div>
      <div class="card-body">
        <div *ngFor="let line of lineItems.controls; let i=index" [formGroupName]="i" class="line-item">
          <input type="text" formControlName="description" [placeholder]="'ACCOUNTS_PAYABLE.FORM.DESCRIPCION' | translate" class="line-description">
          <input type="number" formControlName="quantity" [placeholder]="'ACCOUNTS_PAYABLE.FORM.CANT' | translate">
          <input type="number" formControlName="price" [placeholder]="'ACCOUNTS_PAYABLE.FORM.PRECIO' | translate">
          <input type="text" formControlName="expenseAccountId" [placeholder]="'ACCOUNTS_PAYABLE.FORM.CUENTA_GASTO' | translate">
          <button (click)="removeLineItem(i)" class="btn-danger-outline btn-icon">{{ 'ACCOUNTS_PAYABLE.FORM.TIMES' | translate }}</button>
        </div>
        <button (click)="addLineItem()" class="btn-secondary mt-2">{{ 'ACCOUNTS_PAYABLE.FORM.ANADIR_LINEA' | translate }}</button>
      </div>
    </div>

    <div class="card">
        <div class="card-body">
            <div class="form-field">
                <label for="notes">{{ 'ACCOUNTS_PAYABLE.FORM.NOTAS' | translate }}</label>
                <textarea id="notes" formControlName="notes" rows="3"></textarea>
            </div>
        </div>
    </div>

    <div class="form-actions">
        <a routerLink="/accounts-payable" class="btn-secondary">{{ 'ACCOUNTS_PAYABLE.FORM.CANCELAR' | translate }}</a>
        <button (click)="save()" class="btn-primary" [disabled]="form.invalid || isLoading()">
            {{ isLoading() ? 'Guardando...' : 'Guardar Factura' }}
        </button>
    </div>

  </div>
</div>
