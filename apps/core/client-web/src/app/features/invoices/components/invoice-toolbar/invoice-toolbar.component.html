<div class="sap-toolbar">
  <!-- Navigation Group -->
  <div class="toolbar-group" *ngIf="canNavigate">
    <button class="tool-btn" (click)="onNavigate('first')" [title]="'invoices.invoice_toolbar.first' | translate">
      <lucide-icon [img]="FirstIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="onNavigate('prev')" [title]="'invoices.invoice_toolbar.previous' | translate">
      <lucide-icon [img]="PrevIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="onNavigate('next')" [title]="'invoices.invoice_toolbar.go_next' | translate">
      <lucide-icon [img]="NextIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="onNavigate('last')" [title]="'invoices.invoice_toolbar.last' | translate">
      <lucide-icon [img]="LastIcon" size="18"></lucide-icon>
    </button>
  </div>

  <div class="separator" *ngIf="canNavigate"></div>

  <!-- History Navigation -->
  <div class="toolbar-group">
    <button class="tool-btn" (click)="back.emit()" [title]="'invoices.invoice_toolbar.back' | translate">
      <lucide-icon [img]="BackIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="forward.emit()" [title]="'invoices.invoice_toolbar.next' | translate">
      <lucide-icon [img]="ForwardIcon" size="18"></lucide-icon>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Main Actions -->
  <div class="toolbar-group">
    <button class="tool-btn" (click)="printRequested.emit()" [title]="'invoices.invoice_toolbar.print' | translate">
      <lucide-icon [img]="PrintIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="emailRequested.emit()" [title]="'invoices.invoice_toolbar.send_email' | translate">
      <lucide-icon [img]="EmailIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="searchRequested.emit()" [title]="'invoices.invoice_toolbar.search_within_document' | translate">
      <lucide-icon [img]="SearchIcon" size="18"></lucide-icon>
    </button>
  </div>

  <div class="separator"></div>

  <!-- Export Group -->
  <div class="toolbar-group">
    <button class="tool-btn" (click)="exportRequested.emit('pdf')" [title]="'invoices.invoice_toolbar.export_pdf' | translate">
      <lucide-icon [img]="PdfIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="exportRequested.emit('excel')" [title]="'invoices.invoice_toolbar.export_excel' | translate">
      <lucide-icon [img]="ExcelIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="exportRequested.emit('word')" [title]="'invoices.invoice_toolbar.export_word' | translate">
      <lucide-icon [img]="WordIcon" size="18"></lucide-icon>
    </button>
  </div>

  <div class="separator" *ngIf="canCopy"></div>

  <!-- Copy Group -->
  <div class="toolbar-group" *ngIf="canCopy">
    <button class="tool-btn text-btn" (click)="copyFrom.emit()" [title]="'invoices.invoice_toolbar.copy_from_document' | translate">
        <lucide-icon [img]="ImportIcon" size="16"></lucide-icon>
        <span>{{ 'invoices.invoice_toolbar.copy_from' | translate }}</span>
    </button>
    <button class="tool-btn text-btn" (click)="copyTo.emit()" [title]="'invoices.invoice_toolbar.copy_document' | translate">
        <lucide-icon [img]="CopyIcon" size="16"></lucide-icon>
        <span>{{ 'invoices.invoice_toolbar.copy' | translate }}</span>
    </button>
  </div>

  <div class="spacer"></div>

  <!-- Utility Group -->
  <div class="toolbar-group">
    <button class="tool-btn" (click)="tools.emit()" [title]="'invoices.invoice_toolbar.form_settings' | translate">
      <lucide-icon [img]="ToolsIcon" size="18"></lucide-icon>
    </button>
    <button class="tool-btn" (click)="help.emit()" [title]="'invoices.invoice_toolbar.help' | translate">
      <lucide-icon [img]="HelpIcon" size="18"></lucide-icon>
    </button>
  </div>
</div>
