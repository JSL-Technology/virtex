<!--
  QA A-18: la barra tenía 15 iconos sin texto —dos juegos de flechas, imprimir, correo, búsqueda,
  PDF, Excel, Word, ajustes y ayuda— y ninguno decía «cobrar». Ahora lo que se hace a diario lleva
  nombre (Registrar cobro, Imprimir, Enviar, PDF), lo ocasional vive en «Más», y en un documento
  que todavía no existe no se ofrece imprimir ni enviar nada.
-->
<div class="doc-toolbar" role="toolbar" [attr.aria-label]="'invoices.invoice_toolbar.label' | translate">
  @if (canNavigate) {
    <div class="toolbar-group" role="group" [attr.aria-label]="'invoices.invoice_toolbar.records' | translate">
      <button class="tool-btn" (click)="onNavigate('prev')" [disabled]="!hasPrevious" [title]="'invoices.invoice_toolbar.previous' | translate" [attr.aria-label]="'invoices.invoice_toolbar.previous' | translate" type="button">
        <lucide-icon [img]="PrevIcon" size="18" aria-hidden="true"></lucide-icon>
      </button>
      <button class="tool-btn" (click)="onNavigate('next')" [disabled]="!hasNext" [title]="'invoices.invoice_toolbar.go_next' | translate" [attr.aria-label]="'invoices.invoice_toolbar.go_next' | translate" type="button">
        <lucide-icon [img]="NextIcon" size="18" aria-hidden="true"></lucide-icon>
      </button>
    </div>
    <div class="separator" aria-hidden="true"></div>
  }

  @if (!isNew) {
    <div class="toolbar-group">
      @if (canCollect) {
        <button class="tool-btn text-btn tool-btn--primary" (click)="collectRequested.emit()" type="button">
          <lucide-icon [img]="CollectIcon" size="16" aria-hidden="true"></lucide-icon>
          <span>{{ 'invoices.invoice_toolbar.collect' | translate }}</span>
        </button>
      }
      <button class="tool-btn text-btn" (click)="printRequested.emit()" type="button">
        <lucide-icon [img]="PrintIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'invoices.invoice_toolbar.print' | translate }}</span>
      </button>
      <button class="tool-btn text-btn" (click)="emailRequested.emit()" type="button">
        <lucide-icon [img]="EmailIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'invoices.invoice_toolbar.send' | translate }}</span>
      </button>
      <button class="tool-btn text-btn" (click)="exportRequested.emit('pdf')" type="button">
        <lucide-icon [img]="PdfIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'invoices.invoice_toolbar.pdf' | translate }}</span>
      </button>
    </div>
  }

  @if (canCopy) {
    <div class="separator" aria-hidden="true"></div>
    <div class="toolbar-group">
      @if (canCopyFrom) {
        <button class="tool-btn text-btn" (click)="copyFrom.emit()" type="button">
          <lucide-icon [img]="ImportIcon" size="16" aria-hidden="true"></lucide-icon>
          <span>{{ 'invoices.invoice_toolbar.copy_from' | translate }}</span>
        </button>
      }
      @if (!isNew) {
        <button class="tool-btn text-btn" (click)="copyTo.emit()" type="button">
          <lucide-icon [img]="CopyIcon" size="16" aria-hidden="true"></lucide-icon>
          <span>{{ 'invoices.invoice_toolbar.copy' | translate }}</span>
        </button>
      }
    </div>
  }

  <div class="spacer"></div>

  <div class="more">
    <button
      class="tool-btn text-btn"
      type="button"
      aria-haspopup="menu"
      [attr.aria-expanded]="moreOpen()"
      (click)="moreOpen.set(!moreOpen())"
    >
      <lucide-icon [img]="MoreIcon" size="16" aria-hidden="true"></lucide-icon>
      <span>{{ 'invoices.invoice_toolbar.more' | translate }}</span>
    </button>
    @if (moreOpen()) {
      <ul class="more-menu" role="menu" tabindex="-1" (keydown.escape)="moreOpen.set(false)">
        @if (!isNew) {
          <li role="none">
            <button role="menuitem" type="button" (click)="pick(); exportRequested.emit('excel')">
              <lucide-icon [img]="ExcelIcon" size="16" aria-hidden="true"></lucide-icon>
              {{ 'invoices.invoice_toolbar.export_excel' | translate }}
            </button>
          </li>
          <li role="none">
            <button role="menuitem" type="button" (click)="pick(); searchRequested.emit()">
              <lucide-icon [img]="SearchIcon" size="16" aria-hidden="true"></lucide-icon>
              {{ 'invoices.invoice_toolbar.search_within_document' | translate }}
            </button>
          </li>
        }
        <li role="none">
          <button role="menuitem" type="button" (click)="pick(); tools.emit()">
            <lucide-icon [img]="ToolsIcon" size="16" aria-hidden="true"></lucide-icon>
            {{ 'invoices.invoice_toolbar.form_settings' | translate }}
          </button>
        </li>
        <li role="none">
          <button role="menuitem" type="button" (click)="pick(); help.emit()">
            <lucide-icon [img]="HelpIcon" size="16" aria-hidden="true"></lucide-icon>
            {{ 'invoices.invoice_toolbar.help' | translate }}
          </button>
        </li>
      </ul>
    }
  </div>
</div>
