<vx-draft-shell
  [title]="
    (isEditMode() ? 'accounting.ledger_form.title_edit' : 'accounting.ledger_form.title_create')
      | translate
  "
  [subtitle]="'accounting.ledger_form.define_new_ledger_record_accounting_transactions' | translate"
  [dirty]="ledgerForm.dirty"
  [saving]="isLoading()"
  [invalid]="ledgerForm.invalid"
  [problems]="problems()"
  [form]="ledgerForm"
  saveLabelKey="accounting.ledger_form.save_ledger"
  cancelLabelKey="accounting.ledger_form.cancel"
  (save)="saveLedger()"
  (cancelled)="cancel()"
>
  <div class="form-body" [formGroup]="ledgerForm">
    <section class="form-section">
      <div class="form-field">
        <label for="name">{{ 'accounting.ledger_form.ledger_name' | translate }}</label>
        <input
          id="name"
          formControlName="name"
          [placeholder]="'accounting.ledger_form.main_ifrs_ledger' | translate"
        />
      </div>

      <div class="form-field">
        <label for="description">{{ 'accounting.ledger_form.description' | translate }}</label>
        <textarea
          id="description"
          formControlName="description"
          rows="4"
          [placeholder]="'accounting.ledger_form.used_ifrs_financial_reporting' | translate"
        ></textarea>
      </div>

      <div class="form-field checkbox-field">
        <input id="isDefault" type="checkbox" formControlName="isDefault" />
        <label for="isDefault">
          {{ 'accounting.ledger_form.set_default_ledger' | translate }}
        </label>
      </div>
    </section>
  </div>
</vx-draft-shell>
