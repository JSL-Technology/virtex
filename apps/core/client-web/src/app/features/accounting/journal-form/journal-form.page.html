<vx-draft-shell
  [title]="
    (isEditMode ? 'ACCOUNTING.JOURNAL_FORM.TITLE_EDIT' : 'ACCOUNTING.JOURNAL_FORM.TITLE_CREATE')
      | translate
  "
  [dirty]="journalForm.dirty"
  [invalid]="journalForm.invalid"
  [problems]="problems()"
  saveLabelKey="ACCOUNTING.JOURNAL_FORM.SAVE"
  cancelLabelKey="ACCOUNTING.JOURNAL_FORM.CANCEL"
  (save)="onSubmit()"
  (cancel)="cancel()"
>
  <div class="form-body" [formGroup]="journalForm">
    <section class="form-section">
      <div class="form-grid">
        <div class="form-field">
          <label for="name">{{ 'ACCOUNTING.JOURNAL_FORM.NAME' | translate }}</label>
          <input type="text" id="name" formControlName="name" />
        </div>
        <div class="form-field">
          <label for="code">{{ 'ACCOUNTING.JOURNAL_FORM.CODE' | translate }}</label>
          <input type="text" id="code" formControlName="code" />
        </div>
        <div class="form-field">
          <label for="type">{{ 'ACCOUNTING.JOURNAL_FORM.TYPE' | translate }}</label>
          <select id="type" formControlName="type">
            <option value="SALES">{{ 'ACCOUNTING.JOURNAL_FORM.SALES' | translate }}</option>
            <option value="PURCHASES">{{ 'ACCOUNTING.JOURNAL_FORM.PURCHASES' | translate }}</option>
            <option value="CASH">{{ 'ACCOUNTING.JOURNAL_FORM.CASH' | translate }}</option>
            <option value="BANK">{{ 'ACCOUNTING.JOURNAL_FORM.BANK' | translate }}</option>
            <option value="GENERAL">{{ 'ACCOUNTING.JOURNAL_FORM.GENERAL' | translate }}</option>
          </select>
        </div>
      </div>
    </section>
  </div>
</vx-draft-shell>
