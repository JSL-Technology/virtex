<vx-draft-shell
  [title]="
    (isEditMode() ? 'MASTERS.SUPPLIER_FORM.TITLE_EDIT' : 'MASTERS.SUPPLIER_FORM.TITLE_NEW')
      | translate
  "
  [subtitle]="'MASTERS.SUPPLIER_FORM.COMPLETA_INFORMACION_DETALLADA_TU_PROVEEDOR' | translate"
  [dirty]="supplierForm.dirty"
  [invalid]="supplierForm.invalid"
  [problems]="problems()"
  [form]="supplierForm"
  saveLabelKey="MASTERS.SUPPLIER_FORM.GUARDAR_PROVEEDOR"
  cancelLabelKey="MASTERS.SUPPLIER_FORM.CANCELAR"
  (save)="saveSupplier()"
  (cancel)="cancel()"
>
  <div class="form-body" [formGroup]="supplierForm">
    <section class="form-section">
      <h2 class="form-section-title">
        {{ 'MASTERS.SUPPLIER_FORM.INFORMACION_PROVEEDOR' | translate }}
      </h2>

      <div class="form-grid">
        <div class="form-field">
          <label for="name">{{ 'MASTERS.SUPPLIER_FORM.NOMBRE_PROVEEDOR' | translate }}</label>
          <input id="name" formControlName="name" />
        </div>
        <div class="form-field">
          <label for="contactPerson">{{ 'MASTERS.SUPPLIER_FORM.PERSONA_CONTACTO' | translate }}</label>
          <input id="contactPerson" formControlName="contactPerson" />
        </div>
        <div class="form-field">
          <label for="taxId">{{ 'MASTERS.SUPPLIER_FORM.ID_FISCAL_RNC_ETC' | translate }}</label>
          <input id="taxId" formControlName="taxId" />
        </div>
        <div class="form-field">
          <label for="address">{{ 'MASTERS.SUPPLIER_FORM.DIRECCION' | translate }}</label>
          <input id="address" formControlName="address" />
        </div>
        <div class="form-field">
          <label for="email">{{ 'MASTERS.SUPPLIER_FORM.CORREO_ELECTRONICO' | translate }}</label>
          <input type="email" id="email" formControlName="email" />
        </div>
        <div class="form-field">
          <label for="phone">{{ 'MASTERS.SUPPLIER_FORM.TELEFONO' | translate }}</label>
          <input type="tel" id="phone" formControlName="phone" />
        </div>
        <div class="form-field">
          <label for="country">{{ 'MASTERS.SUPPLIER_FORM.PAIS' | translate }}</label>
          <!-- Named in the reader's language by `Intl.DisplayNames`; see `CountryNamesService`. -->
          <select id="country" formControlName="country">
            @for (option of countries(); track option.code) {
              <option [value]="option.code">{{ option.name }}</option>
            }
          </select>
          <small class="field-hint">{{ 'MASTERS.SUPPLIER_FORM.PAIS_AYUDA' | translate }}</small>
        </div>
        <!--
          Qué se le retiene a este proveedor depende de quién es, no de lo que escriba quien captura
          la factura: comprarle un servicio a una persona física obliga a retenerle el 100 % del
          ITBIS y el 10 % del honorario; a una sociedad, nada. La clasificación la asigna la
          administración tributaria, así que se pregunta y no se deduce, y en blanco no se retiene
          nada automáticamente.
        -->
        <div class="form-field">
          <label for="taxpayerType">
            {{ 'CONTACTS.CUSTOMER_FORM.TIPO_CONTRIBUYENTE' | translate }}
          </label>
          <select id="taxpayerType" formControlName="taxpayerType">
            <option value="">
              {{ 'CONTACTS.CUSTOMER_FORM.TIPO_CONTRIBUYENTE_SIN_CLASIFICAR' | translate }}
            </option>
            @for (type of taxpayerTypes; track type.value) {
              <option [value]="type.value">{{ type.labelKey | translate }}</option>
            }
          </select>
          <small class="field-hint">
            {{ 'MASTERS.SUPPLIER_FORM.TIPO_CONTRIBUYENTE_AYUDA' | translate }}
          </small>
        </div>
      </div>
    </section>
  </div>
</vx-draft-shell>
