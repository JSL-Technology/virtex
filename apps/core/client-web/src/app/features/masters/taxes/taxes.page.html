<vx-list-shell
  titleKey="masters.taxes.tax_rates"
  [count]="taxes().length"
  [loading]="isLoading()"
  [empty]="taxes().length === 0"
  (reload)="loadTaxes()"
>
  <a
    listActions
    routerLink="/masters/taxes/new"
    class="primary-button"
    *appHasPermission="'taxes:create'"
  >
    <lucide-icon [img]="PlusCircleIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'masters.taxes.new_tax' | translate }}</span>
  </a>

  <div class="table-container card">
    <table class="data-table">
      <thead>
        <tr>
          <th>{{ 'masters.taxes.name' | translate }}</th>
          <th>{{ 'masters.taxes.type' | translate }}</th>
          <th class="text-right">{{ 'masters.taxes.rate' | translate }}</th>
          <th class="text-center">{{ 'masters.taxes.country' | translate }}</th>
          <th class="actions-column"></th>
        </tr>
      </thead>
      <tbody>
        @for (tax of taxes(); track tax.id) {
          <tr>
            <td>{{ tax.name }}</td>
            <td>{{ tax.type }}</td>
            <td class="text-right"><vx-amount [value]="tax.rate" />%</td>
            <td class="text-center">{{ tax.countryCode }}</td>
            <td class="actions-column">
              <!--
                El botón «…» que había aquí no hacía nada: `deleteTax()` existía en el componente,
                con su diálogo de confirmación, y ninguna plantilla lo llamaba. Un menú que no
                responde es peor que no tenerlo, así que se conecta la acción que ya estaba escrita,
                con el permiso que el servidor exige para ella.
              -->
              <button
                type="button"
                class="icon-button"
                *appHasPermission="'taxes:delete'"
                [attr.aria-label]="'common.delete' | translate"
                (click)="deleteTax(tax)"
              >
                <lucide-icon [img]="TrashIcon" size="18" aria-hidden="true"></lucide-icon>
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</vx-list-shell>
