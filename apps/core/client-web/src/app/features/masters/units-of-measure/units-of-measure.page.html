<vx-list-shell
  titleKey="MASTERS.UNITS_OF_MEASURE.UNITS_MEASURE"
  [count]="units().length"
  [empty]="units().length === 0"
>
  <button listActions type="button" class="primary-button">
    <lucide-icon [img]="PlusCircleIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'MASTERS.UNITS_OF_MEASURE.NEW_UNIT' | translate }}</span>
  </button>

  <div class="table-container card">
    <table class="data-table">
      <thead>
        <tr>
          <th>{{ 'MASTERS.UNITS_OF_MEASURE.NAME' | translate }}</th>
          <th>{{ 'MASTERS.UNITS_OF_MEASURE.SYMBOL' | translate }}</th>
          <th>{{ 'MASTERS.UNITS_OF_MEASURE.TYPE' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        @for (unit of units(); track unit.id) {
          <tr>
            <td>{{ unit.name }}</td>
            <td>{{ unit.symbol }}</td>
            <td>{{ unit.type }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</vx-list-shell>
