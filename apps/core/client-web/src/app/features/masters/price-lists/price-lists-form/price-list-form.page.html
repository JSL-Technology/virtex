<vx-draft-shell
  [title]="
    (isEditMode() ? 'masters.price_lists_form.title_edit' : 'masters.price_lists_form.title_new')
      | translate
  "
  [subtitle]="'masters.price_lists_form.define_prices_specific_set_products' | translate"
  [dirty]="priceListForm.dirty"
  [saving]="isSaving()"
  [invalid]="priceListForm.invalid"
  [problems]="problems()"
  [form]="priceListForm"
  saveLabelKey="masters.price_lists_form.save_list"
  cancelLabelKey="masters.price_lists_form.cancel"
  (save)="savePriceList()"
  (cancelled)="cancel()"
>
  <div class="form-body" [formGroup]="priceListForm">
    <section class="form-section">
        <div class="form-grid">
            <div class="form-field">
                <label for="name">{{ 'masters.price_lists_form.list_name' | translate }} *</label>
                <input id="name" formControlName="name">
            </div>
             <div class="form-field">
                <label for="status">{{ 'masters.price_lists_form.status' | translate }}</label>
                <select id="status" formControlName="status">
                    @for (s of statusOptions; track s) {
                        <option [value]="s">{{s}}</option>
                    }
                </select>
            </div>
            <div class="form-field">
                <label for="currency">{{ 'masters.price_lists_form.currency' | translate }}</label>
                <select id="currency" formControlName="currency">
                    <option value="USD">{{ 'masters.price_lists_form.usd_united_states_dollar' | translate }}</option>
                    <option value="DOP">{{ 'masters.price_lists_form.dop_dominican_peso' | translate }}</option>
                    <option value="EUR">{{ 'masters.price_lists_form.eur_euro' | translate }}</option>
                </select>
            </div>
        </div>
        <div class="form-grid">
            <div class="form-field">
                <label for="validFrom">{{ 'masters.price_lists_form.valid_from' | translate }}</label>
                <input id="validFrom" type="date" formControlName="validFrom">
            </div>
            <div class="form-field">
                <label for="validTo">{{ 'masters.price_lists_form.valid_until' | translate }}</label>
                <input id="validTo" type="date" formControlName="validTo">
            </div>
        </div>

    </section>

    <section class="form-section line-items-section">
      <h2 class="form-section-title">
        {{ 'masters.price_lists_form.price_list_items' | translate }}
      </h2>
            <div class="table-container">
                <table class="data-table" formArrayName="items">
                    <thead>
                        <tr>
                            <th style="width: 50%;">{{ 'masters.price_lists_form.product' | translate }}</th>
                            <th class="text-right" style="width: 40%;">{{ 'masters.price_lists_form.price' | translate }}</th>
                            <th class="actions-column">{{ 'masters.price_lists_form.actions' | translate }}</th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (line of lines.controls; track $index; let i = $index) {
                            <tr [formGroupName]="i">
                                <td>
                                    <select formControlName="productId">
                                        <option value="" disabled>{{ 'masters.price_lists_form.select_product' | translate }}</option>
                                        @for (product of products(); track product.id) {
                                            <option [value]="product.id">
                                                {{ product.name }} ({{product.sku}})
                                            </option>
                                        }
                                    </select>
                                </td>
                                <td>
                                    <input type="number" formControlName="price" class="text-right" min="0" step="0.01">
                                </td>
                                <td class="actions-column text-center">
                                    <button type="button" class="icon-button delete" (click)="removeLine(i)" [disabled]="lines.length <= 1">
                                        <lucide-icon [img]="TrashIcon" size="16"></lucide-icon>
                                    </button>
                                </td>
                            </tr>
                        }
                    </tbody>
                </table>
            </div>
      <button type="button" class="secondary-button add-line-btn" (click)="addLine()">
        <lucide-icon [img]="PlusIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'masters.price_lists_form.add_line' | translate }}</span>
      </button>
    </section>
  </div>
</vx-draft-shell>
