<div class="subview-container">
    <div class="subview-header">
        <h3>{{ 'MASTERS.PAYMENT_TERMS.PAYMENT_TERMS' | translate }}</h3>
        <div class="header-actions">
            <button class="primary-button">
                <lucide-icon [img]="PlusCircleIcon" size="16"></lucide-icon>
                <span>{{ 'MASTERS.PAYMENT_TERMS.NEW_TERM' | translate }}</span>
            </button>
        </div>
    </div>
    <div class="table-container card">
        <table class="data-table">
            <thead>
                <tr>
                    <th>{{ 'MASTERS.PAYMENT_TERMS.NAME' | translate }}</th>
                    <th class="text-right">{{ 'MASTERS.PAYMENT_TERMS.NET_DAYS' | translate }}</th>
                    <th class="actions-column"></th>
                </tr>
            </thead>
            <tbody>
                @for(term of terms(); track term.id) {
                <tr>
                    <td><a href="#" class="table-link">{{ term.name }}</a></td>
                    <td class="text-right">{{ term.days }}</td>
                    <td class="actions-column">
                        <button class="icon-button">
                            <lucide-icon [img]="MoreHorizontalIcon" size="18"></lucide-icon>
                        </button>
                    </td>
                </tr>
                }
            </tbody>
        </table>
    </div>
</div>
