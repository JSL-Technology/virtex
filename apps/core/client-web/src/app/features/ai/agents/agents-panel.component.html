<vx-settings-group titleKey="ai.agents.title" descriptionKey="ai.agents.intro">
  @switch (state()) {
    @case ('loading') {
      <vx-spinner withLabel labelKey="settings.sections.loading" />
    }
    @case ('error') {
      <vx-error-state [detail]="'ai.agents.load_failed' | translate" (retry)="load()" />
    }
    @default {
      @if (draft(); as d) {
        <vx-settings-group [level]="3" titleKey="ai.agents.replenishment.title" descriptionKey="ai.agents.replenishment.help">
          <div class="ag__options">
            <label class="ag__check">
              <input type="checkbox" [checked]="d.enabled" [disabled]="!canManage() || saving()" (change)="patch({ enabled: $any($event.target).checked })" />
              <span>{{ 'ai.agents.replenishment.enabled' | translate }}</span>
            </label>
            <label class="ag__check">
              <input type="checkbox" [checked]="d.submitForApproval" [disabled]="!canManage() || saving()" (change)="patch({ submitForApproval: $any($event.target).checked })" />
              <span>{{ 'ai.agents.replenishment.submit' | translate }}</span>
            </label>
            <div class="ag__field">
              <label class="ag__label" for="ag-limit">{{ 'ai.agents.replenishment.limit' | translate }}</label>
              <input id="ag-limit" class="ag__input" type="number" min="0" step="0.01" inputmode="decimal"
                     [value]="d.maxOrderAmount ?? ''" [disabled]="!canManage() || saving()" aria-describedby="ag-limit-hint"
                     (input)="setLimit($any($event.target).value)" />
              <small class="ag__hint" id="ag-limit-hint">{{ 'ai.agents.replenishment.limit_hint' | translate }}</small>
            </div>
          </div>
        </vx-settings-group>
      }
    }
  }
</vx-settings-group>
