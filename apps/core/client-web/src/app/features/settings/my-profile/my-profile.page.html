<div class="profile-page">

  <!-- ── Profile Banner ──────────────────────────────────────────── -->
  <div class="profile-card profile-banner">
    <div class="p-avatar-wrap">
      <div class="p-avatar-halo" aria-hidden="true"></div>
      <div class="p-avatar">
        <img [src]="avatarPreview() || 'assets/images/default-avatar.svg'" [alt]="'SETTINGS.MY_PROFILE.AVATAR' | translate">
      </div>
      <label class="p-avatar-upload" [title]="'SETTINGS.PROFILE.CHANGE_AVATAR' | translate" for="field">
        <lucide-icon [img]="ImageIcon" size="16"></lucide-icon>
        <input id="field" type="file" class="visually-hidden" (change)="onFileSelected($event)" accept="image/*">
      </label>
    </div>

    <div class="p-banner-info">
      <h1 class="p-banner-name">{{ currentUser()?.firstName }} {{ currentUser()?.lastName }}</h1>
      <p class="p-banner-email">{{ currentUser()?.email }}</p>
      <span class="p-banner-role">{{ currentUser()?.roles?.[0]?.name || 'Usuario' }}</span>
    </div>
  </div>

  <!-- ── Two-column grid ─────────────────────────────────────────── -->
  <div class="profile-grid">

    <!-- Left: Personal info -->
    <div class="profile-card">
      <div class="profile-card__head">
        <lucide-icon [img]="UserIcon" size="18"></lucide-icon>
        <h2>{{ 'SETTINGS.PROFILE.PERSONAL_INFO' | translate }}</h2>
      </div>
      <div class="profile-card__body">
        <form [formGroup]="profileForm" (ngSubmit)="saveProfile()">
          <div class="pf-grid-2">
            <div class="pf-field">
              <label class="pf-label" for="firstname">{{ 'SETTINGS.PROFILE.FIRST_NAME' | translate }}</label>
              <input id="firstname" type="text" formControlName="firstName" [placeholder]="'SETTINGS.MY_PROFILE.JUAN' | translate">
            </div>
            <div class="pf-field">
              <label class="pf-label" for="lastname">{{ 'SETTINGS.PROFILE.LAST_NAME' | translate }}</label>
              <input id="lastname" type="text" formControlName="lastName" [placeholder]="'SETTINGS.MY_PROFILE.PEREZ' | translate">
            </div>
          </div>

          <div class="pf-field">
            <label class="pf-label" for="email">{{ 'SETTINGS.PROFILE.EMAIL' | translate }}</label>

            <!-- Read-only, with the two-step change flow behind the button. The address cannot be
                 edited in place: a silent change would redirect account recovery, so it is
                 confirmed from the new address and announced to the old one. -->
            <ng-container *ngIf="!changingEmail(); else emailChangeForm">
              <div class="pf-phone-row">
                <div class="pf-icon-wrap pf-icon-wrap--grow">
                  <lucide-icon [img]="MailIcon" size="16" class="pf-icon"></lucide-icon>
                  <input id="email" type="email" formControlName="email" class="has-icon" readonly>
                </div>
                <button type="button" class="pf-verify-btn" (click)="startEmailChange()">
                  {{ 'SETTINGS.PROFILE.CHANGE_EMAIL' | translate }}
                </button>
              </div>
            </ng-container>

            <ng-template #emailChangeForm>
              <div class="pf-phone-row">
                <div class="pf-icon-wrap pf-icon-wrap--grow">
                  <lucide-icon [img]="MailIcon" size="16" class="pf-icon"></lucide-icon>
                  <input id="new-email" type="email" class="has-icon"
                         [value]="newEmail()"
                         (input)="newEmail.set($any($event.target).value)"
                         [placeholder]="'SETTINGS.MY_PROFILE.NUEVO_CORREO_COM' | translate" autocomplete="email">
                </div>
                <button type="button" class="pf-verify-btn" (click)="requestEmailChange()">
                  {{ 'SETTINGS.PROFILE.SEND_CONFIRMATION' | translate }}
                </button>
                <button type="button" class="pf-verify-btn" (click)="cancelEmailChange()">
                  {{ 'COMMON.CANCEL' | translate }}
                </button>
              </div>
              <p class="pf-hint">
                {{ 'SETTINGS.PROFILE.EMAIL_CHANGE_HINT' | translate }}
              </p>
            </ng-template>
          </div>

          <div class="pf-field">
            <label class="pf-label" for="phone">{{ 'SETTINGS.PROFILE.PHONE' | translate }}</label>
            <div class="pf-phone-row">
              <div class="pf-icon-wrap pf-icon-wrap--grow">
                <lucide-icon [img]="PhoneIcon" size="16" class="pf-icon"></lucide-icon>
                <input id="phone" type="tel" formControlName="phone" class="has-icon" placeholder="+1 (809) 000-0000">
              </div>
              <button type="button" class="pf-verify-btn" (click)="openPhoneVerification()">
                {{ 'SETTINGS.PROFILE.VERIFY' | translate }}
              </button>
            </div>
          </div>

          <div class="pf-field">
            <label class="pf-label" for="jobtitle">{{ 'SETTINGS.PROFILE.JOB_TITLE' | translate }}</label>
            <div class="pf-icon-wrap">
              <lucide-icon [img]="CompanyIcon" size="16" class="pf-icon"></lucide-icon>
              <select id="jobtitle" formControlName="jobTitle" class="has-icon">
                <option value="" disabled>{{ 'SETTINGS.PROFILE.SELECT_JOB_TITLE' | translate }}</option>
                <option *ngFor="let title of jobTitles()" [value]="title">{{ title }}</option>
              </select>
            </div>
          </div>

          <div class="pf-field">
            <label class="pf-label" for="preferredlanguage">{{ 'SETTINGS.MY_PROFILE.IDIOMA_PREFERIDO' | translate }}</label>
            <select id="preferredlanguage" formControlName="preferredLanguage">
              <option value="es">{{ 'SETTINGS.MY_PROFILE.ESPANOL' | translate }}</option>
              <option value="en">{{ 'SETTINGS.MY_PROFILE.ENGLISH' | translate }}</option>
            </select>
          </div>

          <div class="pf-actions">
            <button type="submit"
                    [disabled]="profileForm.invalid || profileForm.pristine || isLoading"
                    class="pf-btn-primary">
              @if (isLoading) {
                <span class="pf-spinner"></span>
              } @else {
                <lucide-icon [img]="SaveIcon" size="16"></lucide-icon>
              }
              {{ 'SETTINGS.PROFILE.SAVE_CHANGES' | translate }}
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Right: Password + 2FA + Sessions -->
    <div class="profile-right-col">

      <!-- Password card -->
      <div class="profile-card">
        <div class="profile-card__head">
          <lucide-icon [img]="ShieldIcon" size="18"></lucide-icon>
          <h2>{{ 'SETTINGS.PROFILE.SECURITY' | translate }}</h2>
        </div>
        <div class="profile-card__body">
          <form [formGroup]="passwordForm" (ngSubmit)="changePassword()">
            <!-- Hidden username field for password managers -->
            <input type="text" autocomplete="username"
                   style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"
                   [value]="currentUser()?.email">

            <div class="pf-field">
              <label class="pf-label" for="newpassword">{{ 'SETTINGS.PROFILE.NEW_PASSWORD' | translate }}</label>
              <input id="newpassword" type="password" formControlName="newPassword" autocomplete="new-password" placeholder="••••••••">
            </div>
            <div class="pf-field">
              <label class="pf-label" for="confirmpassword">{{ 'SETTINGS.PROFILE.CONFIRM_PASSWORD' | translate }}</label>
              <input id="confirmpassword" type="password" formControlName="confirmPassword" autocomplete="new-password" placeholder="••••••••">
            </div>

            <div class="pf-actions">
              <button type="submit" [disabled]="passwordForm.invalid" class="pf-btn-secondary">
                {{ 'SETTINGS.PROFILE.UPDATE_PASSWORD' | translate }}
              </button>
            </div>
          </form>
        </div>
      </div>

      <!-- 2FA & Sessions (security-settings component) -->
      <app-security-settings></app-security-settings>

    </div>
  </div>
</div>

<!-- Phone Verification Modal -->
<app-phone-verification-modal
   [isOpen]="showPhoneModal"
   (close)="showPhoneModal.set(false)"
   (verified)="onPhoneVerified()">
</app-phone-verification-modal>
