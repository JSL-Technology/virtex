<!-- A backdrop dismiss is a mouse convenience. Its keyboard equivalent is Escape, handled at the document level in the component, plus the dialog's own Close button. Giving the backdrop tabindex/role to satisfy the rule would put a phantom tab stop in front of the dialog. -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<div class="pvm-overlay" *ngIf="isOpen()" (click)="$event.target === $event.currentTarget &amp;&amp; (closed.emit())" (keydown.escape)="closed.emit()">
  <div class="pvm-box" tabindex="0">

    <!-- Header -->
    <div class="pvm-header">
      <div class="pvm-header__title">
        <lucide-icon [img]="PhoneIcon" size="18"></lucide-icon>
        {{ 'settings.profile.phone_verification.title' | translate }}
      </div>
      <button class="pvm-header__close" (click)="closed.emit()">
        <lucide-icon [img]="XIcon" size="18"></lucide-icon>
      </button>
    </div>

    <!-- Body -->
    <div class="pvm-body">

      <!-- Step 1: Enter phone number -->
      @if (!otpSent()) {
        <div class="pvm-step">
          <p class="pvm-info">{{ 'settings.profile.phone_verification.description' | translate }}</p>

          <div class="pvm-field">
            <app-intl-phone-input
              [formControl]="phoneControl"
              [required]="true"
              [label]="'settings.profile.phone_number' | translate"
              placeholder="809 555 0000">
            </app-intl-phone-input>
          </div>

          <button class="pvm-btn-primary"
                  (click)="sendOtp()"
                  [disabled]="phoneControl.invalid || isLoading()">
            @if (isLoading()) {
              <span class="pvm-spinner"></span>
            }
            {{ 'settings.profile.phone_verification.send_code' | translate }}
          </button>
        </div>
      }

      <!-- Step 2: Enter OTP -->
      @if (otpSent()) {
        <div class="pvm-step pvm-step--otp">
          <div class="pvm-otp-info">
            <p class="pvm-info">{{ 'settings.profile.phone_verification.otp_sent_to' | translate }}</p>
            <p class="pvm-phone-display">{{ phoneControl.value }}</p>
          </div>

          <div class="pvm-field">
            <label class="pvm-label pvm-label--center" for="field-2">{{ 'settings.profile.phone_verification.enter_code' | translate }}</label>
            <input id="field-2" type="text"
                   [formControl]="otpControl"
                   maxlength="6"
                   class="pvm-otp-input"
                   placeholder="000000"
                   autocomplete="one-time-code">
          </div>

          <button class="pvm-btn-primary"
                  (click)="verifyOtp()"
                  [disabled]="otpControl.invalid || isLoading()">
            @if (isLoading()) {
              <span class="pvm-spinner"></span>
            }
            {{ 'settings.profile.phone_verification.verify' | translate }}
          </button>

          <div class="pvm-back">
            <button class="pvm-link" (click)="otpSent.set(false)">
              {{ 'settings.profile.phone_verification.wrong_number' | translate }}
            </button>
          </div>
        </div>
      }

    </div>
  </div>
</div>
