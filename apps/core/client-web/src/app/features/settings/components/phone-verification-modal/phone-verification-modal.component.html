<!--
  El armazón —velo, panel, cabecera, cierre, Escape y trampa de foco— es de `vx-dialog`. Lo que
  había aquí era todo eso reimplementado, menos la trampa, que no la tenía nadie en el producto.
-->
@if (isOpen()) {
  <vx-dialog
    size="sm"
    titleKey="settings.profile.phone_verification.title"
    (dismissed)="closed.emit()"
  >
    <div class="pvm-body">

      <!-- Step 1: Enter phone number -->
      @if (!otpSent()) {
        <div class="pvm-step">
          <p class="pvm-info">{{ 'settings.profile.phone_verification.description' | translate }}</p>

          <div class="pvm-field">
            <app-intl-phone-input
              [formControl]="phoneControl"
              [required]="true"
              [label]="'settings.profile.phone_number' | translate"
              placeholder="809 555 0000">
            </app-intl-phone-input>
          </div>

          <button class="pvm-btn-primary"
                  (click)="sendOtp()"
                  [disabled]="phoneControl.invalid || isLoading()">
            @if (isLoading()) {
              <vx-spinner size="sm" />
            }
            {{ 'settings.profile.phone_verification.send_code' | translate }}
          </button>
        </div>
      }

      <!-- Step 2: Enter OTP -->
      @if (otpSent()) {
        <div class="pvm-step pvm-step--otp">
          <div class="pvm-otp-info">
            <p class="pvm-info">{{ 'settings.profile.phone_verification.otp_sent_to' | translate }}</p>
            <p class="pvm-phone-display">{{ phoneControl.value }}</p>
          </div>

          <div class="pvm-field">
            <label class="pvm-label pvm-label--center" for="field-2">{{ 'settings.profile.phone_verification.enter_code' | translate }}</label>
            <input id="field-2" type="text"
                   [formControl]="otpControl"
                   maxlength="6"
                   class="pvm-otp-input"
                   placeholder="000000"
                   autocomplete="one-time-code">
          </div>

          <button class="pvm-btn-primary"
                  (click)="verifyOtp()"
                  [disabled]="otpControl.invalid || isLoading()">
            @if (isLoading()) {
              <vx-spinner size="sm" />
            }
            {{ 'settings.profile.phone_verification.verify' | translate }}
          </button>

          <div class="pvm-back">
            <button class="pvm-link" (click)="otpSent.set(false)">
              {{ 'settings.profile.phone_verification.wrong_number' | translate }}
            </button>
          </div>
        </div>
      }

    </div>
  </vx-dialog>
}
