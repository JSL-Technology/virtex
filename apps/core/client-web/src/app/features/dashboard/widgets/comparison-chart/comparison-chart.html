<div class="widget-header">
    <h3>{{ 'dashboard.comparison_chart.budget_vs_actual_last_12_months' | translate }}</h3>

    @if (isEditMode) {
    <div class="widget-edit-menu">
        <button class="icon-button" (mousedown)="toggleSettings($event); $event.stopPropagation()">
            <lucide-icon [img]="SettingsIcon" size="16"></lucide-icon>
        </button>
        @if (isSettingsOpen()) {
        <div class="edit-dropdown" (mousedown)="$event.stopPropagation()">
            <span class="dropdown-title">{{ 'dashboard.comparison_chart.chart_type' | translate }}</span>
            <button (mousedown)="changeChartType('column', $event)" [class.active]="widget.chartType === 'column'">
                <lucide-icon [img]="ColumnIcon" size="14"></lucide-icon> {{ 'dashboard.comparison_chart.columns' | translate }}
            </button>
            <button (mousedown)="changeChartType('area', $event)" [class.active]="widget.chartType === 'area'">
                <lucide-icon [img]="AreaIcon" size="14"></lucide-icon> {{ 'dashboard.comparison_chart.area' | translate }}
            </button>
        </div>
        }
    </div>
    }
</div>
<div class="widget-content">
    @if (hasBudget()) {
    <highcharts-chart [options]="chartOptions()" class="chart-instance">
    </highcharts-chart>
    } @else {
    <!-- A tenant with no budget gets told so, rather than shown somebody else's plan. -->
    <vx-empty-state titleKey="dashboard.comparison_chart.no_budget_defined_period" />
    }
</div>
