<div class="widget-header">
    <h3>{{ 'dashboard.alerts_panel.early_warnings' | translate }}</h3>
</div>
<div class="widget-content">
    @if (alerts().length === 0) {
    <!-- Nothing wrong is a result, and saying so beats an empty panel that looks broken. -->
    <vx-empty-state
        [icon]="CheckIcon"
        titleKey="dashboard.alerts_panel.nothing_needs_attention_right_now"
    />
    } @else {
    <ul class="alerts-list">
        @for(alert of alerts(); track alert.id) {
        <li class="alert-item" [ngClass]="alert.severity">
            <lucide-icon [img]="alert.severity === 'critical' ? CriticalIcon : WarningIcon" size="20"
                class="alert-icon"></lucide-icon>
            <!-- One sentence per alert, the key the server sends. The template appended `.TITLE` and
                 `.BODY`, which no catalogue defines, so every alert showed its own key. -->
            <div class="alert-details">
                <p class="alert-title">{{ alert.messageKey | translate: alert.params }}</p>
                @if (alert.route) {
                <a class="alert-action" [routerLink]="alert.route">{{ 'dashboard.alerts_panel.review' | translate }}</a>
                }
            </div>
        </li>
        }
    </ul>
    }
</div>
