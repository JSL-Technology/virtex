<vx-draft-shell
  [title]="
    (isEditMode() ? 'CONTACTS.CUSTOMER_FORM.TITLE_EDIT' : 'CONTACTS.CUSTOMER_FORM.TITLE_NEW')
      | translate
  "
  [subtitle]="'CONTACTS.CUSTOMER_FORM.COMPLETA_INFORMACION_DETALLADA_TU_CLIENTE' | translate"
  [dirty]="customerForm.dirty"
  [saving]="isLoading()"
  [invalid]="customerForm.invalid"
  [problems]="problems()"
  saveLabelKey="CONTACTS.CUSTOMER_FORM.GUARDAR_CLIENTE"
  cancelLabelKey="CONTACTS.CUSTOMER_FORM.CANCELAR"
  (save)="saveCustomer()"
  (cancel)="cancel()"
>
  <div class="form-body" [formGroup]="customerForm">
    <div class="form-columns">
      <div class="form-column">
        <section class="form-section">
          <h2 class="form-section-title">
            {{ 'CONTACTS.CUSTOMER_FORM.INFORMACION_PRINCIPAL' | translate }}
          </h2>

          <div class="form-field">
            <label for="companyName">{{ 'CONTACTS.CUSTOMER_FORM.NOMBRE_EMPRESA' | translate }}</label>
            <input id="companyName" formControlName="companyName" />
          </div>
          <div class="form-field">
            <label for="contactPerson">{{ 'CONTACTS.CUSTOMER_FORM.PERSONA_CONTACTO' | translate }}</label>
            <input id="contactPerson" formControlName="contactPerson" />
          </div>
          <div class="form-field">
            <label for="taxId">{{ 'CONTACTS.CUSTOMER_FORM.ID_FISCAL_RNC_ETC' | translate }}</label>
            <input id="taxId" formControlName="taxId" />
          </div>

          <!--
            What this customer withholds at source follows from this classification, the tenant's
            own, and what is sold. It is assigned by the tax authority — a withholding agent is one
            because it appears on a published list — so it is asked for rather than guessed, and
            left blank nothing is withheld.
          -->
          <div class="form-field">
            <label for="taxpayerType">{{ 'CONTACTS.CUSTOMER_FORM.TIPO_CONTRIBUYENTE' | translate }}</label>
            <select id="taxpayerType" formControlName="taxpayerType">
              <option value="">
                {{ 'CONTACTS.CUSTOMER_FORM.TIPO_CONTRIBUYENTE_SIN_CLASIFICAR' | translate }}
              </option>
              @for (type of taxpayerTypes; track type.value) {
                <option [value]="type.value">{{ type.labelKey | translate }}</option>
              }
            </select>
            <small class="field-hint">
              {{ 'CONTACTS.CUSTOMER_FORM.TIPO_CONTRIBUYENTE_AYUDA' | translate }}
            </small>
          </div>
        </section>

        <section class="form-section">
          <h2 class="form-section-title">{{ 'CONTACTS.CUSTOMER_FORM.DATOS_CONTACTO' | translate }}</h2>

          <div class="form-field">
            <label for="email">{{ 'CONTACTS.CUSTOMER_FORM.CORREO_ELECTRONICO' | translate }}</label>
            <input type="email" id="email" formControlName="email" />
          </div>
          <div class="form-field">
            <label for="phone">{{ 'CONTACTS.CUSTOMER_FORM.TELEFONO' | translate }}</label>
            <input type="tel" id="phone" formControlName="phone" />
          </div>
        </section>
      </div>

      <div class="form-column">
        <section class="form-section">
          <h2 class="form-section-title">{{ 'CONTACTS.CUSTOMER_FORM.DIRECCION' | translate }}</h2>

          <div class="form-field">
            <label for="address">{{ 'CONTACTS.CUSTOMER_FORM.LINEA_DIRECCION' | translate }}</label>
            <input id="address" formControlName="address" />
          </div>

          <div class="form-row three-cols">
            <div class="form-field">
              <label for="city">{{ 'CONTACTS.CUSTOMER_FORM.CIUDAD' | translate }}</label>
              <input id="city" formControlName="city" />
            </div>
            <div class="form-field">
              <label for="stateOrProvince">{{ 'CONTACTS.CUSTOMER_FORM.ESTADO_PROVINCIA' | translate }}</label>
              <input id="stateOrProvince" formControlName="stateOrProvince" />
            </div>
            <div class="form-field">
              <label for="postalCode">{{ 'CONTACTS.CUSTOMER_FORM.CODIGO_POSTAL' | translate }}</label>
              <input id="postalCode" formControlName="postalCode" />
            </div>
          </div>

          <div class="form-field">
            <label for="country">{{ 'CONTACTS.CUSTOMER_FORM.PAIS' | translate }}</label>
            <select id="country" formControlName="country">
              <option value="DO">{{ 'CONTACTS.CUSTOMER_FORM.REPUBLICA_DOMINICANA' | translate }}</option>
              <option value="US">{{ 'CONTACTS.CUSTOMER_FORM.ESTADOS_UNIDOS' | translate }}</option>
            </select>
          </div>
        </section>
      </div>
    </div>
  </div>
</vx-draft-shell>
