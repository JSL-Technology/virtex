<vx-inbox-shell
  titleKey="approvals.approvals_centre"
  subtitleKey="approvals.review_approve_reject_every_pending_request"
  [sections]="sections()"
  [loading]="loading()"
  [error]="error()"
  [itemActions]="decide"
  (reload)="load()"
>
</vx-inbox-shell>

<!--
  Aprobar y rechazar resuelven la solicitud sin salir de la bandeja: son la razón por la que esta
  pantalla existe, y navegar a otro sitio para decidir convierte diez decisiones en veinte clics.
-->
<ng-template #decide let-item>
  @if (decisionOf(item.id); as decision) {
    @if (decision.canDecide) {
      <button
        type="button"
        class="secondary-button decide decide--reject"
        [disabled]="deciding() === item.id"
        (click)="reject(item.id)"
      >
        <lucide-icon [img]="RejectIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'approvals.reject' | translate }}</span>
      </button>
      <button
        type="button"
        class="primary-button decide decide--approve"
        [disabled]="deciding() === item.id"
        (click)="approve(item.id)"
      >
        <lucide-icon [img]="ApproveIcon" size="16" aria-hidden="true"></lucide-icon>
        <span>{{ 'approvals.approve' | translate }}</span>
      </button>
    } @else {
      <!-- Shown, not hidden: a document waiting on someone else is still waiting. -->
      <span class="blocked">{{ (decision.blockedReasonKey ?? 'approvals.blocked.not_your_step') | translate }}</span>
    }
  }
</ng-template>
