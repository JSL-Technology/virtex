<vx-list-shell
  titleKey="DOCUMENTS.REPOSITORY.FILE_REPOSITORY"
  [count]="files().length"
  [empty]="files().length === 0"
  [searchable]="true"
  [(search)]="search"
  searchPlaceholderKey="DOCUMENTS.REPOSITORY.SEARCH_IN_THIS_FOLDER"
>
  <button listActions type="button" class="secondary-button">
    <lucide-icon [img]="FolderIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'DOCUMENTS.REPOSITORY.NEW_FOLDER' | translate }}</span>
  </button>
  <button listActions type="button" class="primary-button">
    <lucide-icon [img]="UploadIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'DOCUMENTS.REPOSITORY.UPLOAD_FILE' | translate }}</span>
  </button>

  <nav listFilters class="path-breadcrumbs" [attr.aria-label]="'DOCUMENTS.REPOSITORY.HOME' | translate">
    <span class="path-item">{{ 'DOCUMENTS.REPOSITORY.HOME' | translate }}</span>
  </nav>

  <div class="table-container card">
    <table class="data-table">
      <thead>
        <tr>
          <th>{{ 'DOCUMENTS.REPOSITORY.NAME' | translate }}</th>
          <th>{{ 'DOCUMENTS.REPOSITORY.LAST_MODIFIED' | translate }}</th>
          <th>{{ 'DOCUMENTS.REPOSITORY.FILE_SIZE' | translate }}</th>
        </tr>
      </thead>
      <tbody>
        @for (item of files(); track item.id) {
          <tr class="file-item-row">
            <td>
              <span class="name-cell">
                <lucide-icon
                  [img]="getIconForFileType(item.type)"
                  size="20"
                  [class]="item.type"
                  aria-hidden="true"
                ></lucide-icon>
                <span class="file-name">{{ item.name }}</span>
              </span>
            </td>
            <td>{{ item.modifiedDate }}</td>
            <td>{{ item.size }}</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</vx-list-shell>
