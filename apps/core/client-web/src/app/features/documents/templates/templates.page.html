<vx-list-shell
  titleKey="DOCUMENTS.TEMPLATES.DOCUMENT_TEMPLATES"
  [count]="templates().length"
  [empty]="templates().length === 0"
>
  <button listActions type="button" class="primary-button">
    <lucide-icon [img]="PlusCircleIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'DOCUMENTS.TEMPLATES.NEW_TEMPLATE' | translate }}</span>
  </button>

  <div class="templates-grid">
    @for (template of templates(); track template.id) {
      <article class="template-card">
        <lucide-icon [img]="FileIcon" size="32" class="card-icon" aria-hidden="true"></lucide-icon>
        <div class="card-content">
          <span class="template-name">{{ template.name }}</span>
          <span class="template-meta">
            {{
              'DOCUMENTS.TEMPLATES.TYPE_LAST_MODIFIED_LASTMODIFIED'
                | translate: { type: template.type, lastModified: template.lastModified }
            }}
          </span>
        </div>
      </article>
    }

    <button type="button" class="template-card new-template">
      <lucide-icon [img]="PlusCircleIcon" size="32" aria-hidden="true"></lucide-icon>
      <span>{{ 'DOCUMENTS.TEMPLATES.CREATE_NEW_TEMPLATE' | translate }}</span>
    </button>
  </div>
</vx-list-shell>
