<vx-inbox-shell
  titleKey="my_work.my_work"
  subtitleKey="my_work.your_central_inbox_tasks_approvals_notifications"
  [sections]="sections()"
  [loading]="loading()"
  [error]="error()"
  (reload)="loadWorkItems()"
>
  <!--
    Registrar una llave de acceso no es algo que espere en la bandeja: es una acción sobre la
    cuenta. Estaba detrás de una cuarta pestaña «Seguridad» que tenía botón pero ningún `@case`
    en el `@switch`, así que pulsarla no mostraba nada y la función era inalcanzable.
  -->
  <button inboxActions type="button" class="secondary-button" (click)="registerPasskey()">
    <lucide-icon [img]="SecurityIcon" size="16" aria-hidden="true"></lucide-icon>
    <span>{{ 'my_work.security' | translate }}</span>
  </button>
</vx-inbox-shell>
