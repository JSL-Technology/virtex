<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <title>Virtex</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <!--
    El SVG va PRIMERO y el .ico después: los navegadores modernos se quedan con
    el primer formato que entienden, de modo que la marca se ve nítida en
    cualquier densidad de pantalla, y los antiguos caen al mapa de bits sin que
    haya que detectar nada.
  -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">

  <!--
    El color de la barra del navegador acompaña al tema, no lo contradice. Con
    un solo `theme-color` fijo, la barra del móvil quedaba clara sobre una
    aplicación oscura y viceversa.
  -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f6fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#05070d">

  <!--
    ─────────────────────────────────────────────────────────────────────────
    APLICACIÓN DEL TEMA ANTES DE PINTAR
    ─────────────────────────────────────────────────────────────────────────
    Este script es síncrono y va deliberadamente ANTES de la hoja de estilos:
    se ejecuta antes del primer fotograma, de modo que el atributo `data-theme`
    ya está puesto cuando el navegador calcula los estilos. El resultado es que
    no existe ningún instante en el que se vea el tema equivocado.

    Sustituye a `<link id="app-theme" rel="stylesheet" href="">`, que nacía
    vacío: hasta que Angular booteaba y le asignaba un `href`, la aplicación se
    pintaba SIN TEMA — fondo blanco del navegador, texto negro— y después
    saltaba de golpe al tema real. Ese destello era especialmente violento para
    quien usa tema oscuro.

    En modo «sistema» no se escribe atributo alguno a propósito: decide la
    regla `@media (prefers-color-scheme: dark)` de la hoja de estilos, sin
    intervención de JavaScript.

    Va embebido y no en un archivo aparte porque una petición externa aquí
    reintroduciría exactamente el destello que se pretende eliminar.
  -->
  <script>
    (function () {
      try {
        var mode = localStorage.getItem('vx-theme-mode');
        if (mode === 'light' || mode === 'dark') {
          document.documentElement.setAttribute('data-theme', mode);
        }
        if (localStorage.getItem('vx-contrast-mode') === 'high') {
          document.documentElement.setAttribute('data-contrast', 'high');
        }
        var density = localStorage.getItem('vx-density');
        if (density === 'compact') {
          document.documentElement.setAttribute('data-density', 'compact');
        }
      } catch (e) {
        /* Almacenamiento bloqueado (incógnito de Safari): se usa el tema del
           sistema. Nunca debe impedir el arranque de la aplicación. */
      }
    })();
  </script>

  <!--
    ─────────────────────────────────────────────────────────────────────────
    TIPOGRAFÍA
    ─────────────────────────────────────────────────────────────────────────
    Antes se descargaban CINCO familias en la ruta crítica —Inter, IBM Plex
    Sans, Roboto Slab, Source Code Pro y Material Icons Outlined— mientras la
    hoja de estilos declaraba 'Segoe UI' como fuente base, que no era ninguna
    de ellas. Es decir: se pagaba la descarga de cinco tipografías para acabar
    renderizando con la del sistema.

    Material Icons sobraba por completo: la aplicación usa `lucide-angular`,
    que empaqueta sus iconos como SVG en el bundle.

    Queda Inter, que es la familia que el sistema de diseño declara realmente.
    `display=swap` muestra texto con la fuente de reserva desde el primer
    fotograma en lugar de dejar un hueco en blanco mientras descarga.
  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <link rel="manifest" href="manifest.webmanifest">
</head>

<body>
  <!--
    The skip link lives in `app.html`, not here: its text has to be translated, and it only has
    somewhere to skip to once the layout has rendered. It stays the first focusable element.
  -->
  <app-root></app-root>

  <!--
    Shown exactly when no script can run, so nothing here can pick a language: it carries all
    three. This is the one place in the product where repeating the sentence is correct.
  -->
  <noscript>
    <p lang="es">Esta aplicación necesita JavaScript. Actívalo en tu navegador para continuar.</p>
    <p lang="en">This application needs JavaScript. Enable it in your browser to continue.</p>
    <p lang="pt">Este aplicativo precisa de JavaScript. Ative-o no seu navegador para continuar.</p>
  </noscript>
</body>

</html>
