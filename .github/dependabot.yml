# Dependency updates.
#
# Packages that are released together are updated together. A security update that moved `nx`
# alone once left three Nx releases in the lockfile and a `main` that `npm ci` refused, so no CI
# step ran at all. The groups below keep every family in one pull request — for security updates
# as well as version updates — and `npm run verify:package-families` fails CI on anything that
# still slips through.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # A release has to have been public for a few days before it is proposed: most malicious
    # publishes are caught and pulled within that window. Security updates are not delayed.
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      nx:
        applies-to: version-updates
        patterns: ['nx', '@nx/*']
      nx-security:
        applies-to: security-updates
        patterns: ['nx', '@nx/*']
      angular:
        applies-to: version-updates
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular']
        # The CDK and Material ship on their own cadence.
        exclude-patterns: ['@angular/cdk', '@angular/material']
      angular-security:
        applies-to: security-updates
        patterns: ['@angular/*', '@angular-devkit/*', '@schematics/angular']
        exclude-patterns: ['@angular/cdk', '@angular/material']
      angular-components:
        patterns: ['@angular/cdk', '@angular/material']
      # The Angular adapter and the grid it drives ship as one release (QA C-01).
      dockview:
        patterns: ['dockview', 'dockview-core', 'dockview-angular']
      nestjs:
        applies-to: version-updates
        patterns: ['@nestjs/*']
      nestjs-security:
        applies-to: security-updates
        patterns: ['@nestjs/*']
      # The desktop runtime. Electron receives security fixes only on its newest three majors and
      # ships one most weeks; a lagging Electron is a lagging Chromium. It is pinned exactly, so every
      # release arrives as a pull request that the desktop tests and the supply-chain gate judge.
      electron:
        patterns: ['electron']
      # The packager and the updater read and write the same update-manifest format
      # (builder-util-runtime); apps/desktop/build-config.test.js fails when they drift apart.
      electron-builder:
        patterns: ['electron-builder', 'app-builder-lib', 'dmg-builder', 'builder-util', 'builder-util-runtime', '@electron/*']

  # What the desktop installer ships: its own manifest and lockfile, so nothing from the monorepo can
  # end up inside it. One runtime dependency today (electron-updater).
  - package-ecosystem: npm
    directory: /apps/desktop
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(desktop)
    groups:
      desktop-runtime:
        patterns: ['*']

  # Workflows pin every action by commit SHA; this keeps the pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']
