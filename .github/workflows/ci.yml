name: CI

on:
  push:
    # The repository's default branch is `main`. This said `master`, so nothing ever ran on a
    # push to the branch that actually ships.
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      # The schema-drift check provisions a scratch database from the migrations and diffs it
      # against the entity definitions. Without a real Postgres it could not run at all, which is
      # how the repository ended up with no baseline migration in the first place.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virteex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: virteex_ci
      DB_SSL: 'false'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      # The Cypress binary is only needed by the e2e projects, which this workflow does not run.
      # Downloading it on every job costs ~2 minutes and is a frequent source of flaky installs.
      - run: npm ci
        env:
          CYPRESS_INSTALL_BINARY: '0'

      - run: npx nx run-many -t lint test build typecheck

      # Proves the migrations and the entities describe the same schema. A missing migration is
      # invisible locally (where the schema was created by an earlier `synchronize`) and only
      # surfaces as a broken deploy; this turns it into a failing build.
      - run: npm run check:schema-drift

      # Proves the application can actually START. A build only proves the code compiles; a missing
      # provider, an unexported service, a module registered twice, or a constructor that throws on
      # a missing environment variable all compile cleanly and fail on deploy. Three such faults
      # were found the first time this ran: reCAPTCHA registered globally in two modules with
      # conflicting disable logic, a push-notification constructor that threw on an undeclared
      # VAPID key and took the whole process down with it, and `DB_SSL=false` enabling TLS because
      # the flag was never coerced from its string form.
      - run: npm run verify:boot
        env:
          NODE_ENV: test
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          JWT_REFRESH_SECRET: ci-refresh-ci-refresh-ci-refresh-ci-refresh
          JWT_2FA_TEMP_SECRET: ci-2fa-ci-2fa-ci-2fa-ci-2fa-ci-2fa-ci
          JWT_PREVERIFY_SECRET: ci-pre-ci-pre-ci-pre-ci-pre-ci-pre-ci
          JWT_SOCIAL_REGISTER_SECRET: ci-social-ci-social-ci-social-ci-social
          JWT_STEP_UP_SECRET: ci-stepup-ci-stepup-ci-stepup-ci-stepup
          CSRF_SECRET: ci-csrf-ci-csrf-ci-csrf-ci-csrf-ci-csrf
          ENCRYPTION_SECRET: ci-enc-ci-enc-ci-enc-ci-enc-ci-enc-ci
          AUTH_SALT: ci-salt-ci-salt-ci
          FRONTEND_URL: https://ci.example.com
          CORS_ORIGIN: https://ci.example.com
          STRIPE_PRICE_STARTER: price_ci_starter
          STRIPE_PRICE_PRO: price_ci_pro
          STRIPE_PRICE_ENTERPRISE: price_ci_enterprise
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_ci
          AWS_S3_BUCKET_NAME: ci-bucket
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ci-key
          AWS_SECRET_ACCESS_KEY: ci-secret
          RECAPTCHA_DISABLED: 'true'
          REDIS_HOST: localhost
          REDIS_PORT: '6379'

      - run: npx nx fix-ci
        if: always()
