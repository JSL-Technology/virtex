name: CI

on:
  push:
    # The repository's default branch is `main`. This said `master`, so nothing ever ran on a
    # push to the branch that actually ships.
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest

    services:
      # The schema-drift check provisions a scratch database from the migrations and diffs it
      # against the entity definitions. Without a real Postgres it could not run at all, which is
      # how the repository ended up with no baseline migration in the first place.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: virteex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Hoisted to the job so every verification step below runs against the same configuration.
    # These used to be repeated per step, which is how `verify:markets`, `verify:provisioning`
    # and `verify:auth-contract` could each be added and each quietly need a different subset.
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: virteex_ci
      DB_SSL: 'false'

      # Redis is no longer optional: the cache, the throttler and the mail queue all resolve
      # their connection from these, and the application refuses to boot outside development
      # without a reachable server. A single-process in-memory fallback would make the
      # rate-limit and session-revocation checks pass for the wrong reason.
      REDIS_HOST: localhost
      REDIS_PORT: '6379'

      # Nothing listens on 1025 in the runner and nothing needs to: nodemailer connects on the
      # first send, and no verification step sends mail. `example.com` rather than `example.test`
      # because Joi validates the address against the IANA TLD list, and `.test` — reserved by
      # RFC 6761 but never delegated — is not on it.
      MAIL_HOST: localhost
      MAIL_PORT: '1025'
      MAIL_FROM_ADDRESS: ci@example.com
      MAIL_FROM_NAME: Virteex CI

      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      JWT_REFRESH_SECRET: ci-refresh-ci-refresh-ci-refresh-ci-refresh
      JWT_2FA_TEMP_SECRET: ci-2fa-ci-2fa-ci-2fa-ci-2fa-ci-2fa-ci
      JWT_PREVERIFY_SECRET: ci-pre-ci-pre-ci-pre-ci-pre-ci-pre-ci
      JWT_SOCIAL_REGISTER_SECRET: ci-social-ci-social-ci-social-ci-social
      JWT_STEP_UP_SECRET: ci-stepup-ci-stepup-ci-stepup-ci-stepup
      CSRF_SECRET: ci-csrf-ci-csrf-ci-csrf-ci-csrf-ci-csrf
      ENCRYPTION_SECRET: ci-enc-ci-enc-ci-enc-ci-enc-ci-enc-ci
      AUTH_SALT: ci-salt-ci-salt-ci
      FRONTEND_URL: https://ci.example.com
      CORS_ORIGIN: https://ci.example.com
      STRIPE_PRICE_STARTER: price_ci_starter
      STRIPE_PRICE_PRO: price_ci_pro
      STRIPE_PRICE_ENTERPRISE: price_ci_enterprise
      STRIPE_SECRET_KEY: sk_test_ci
      STRIPE_WEBHOOK_SECRET: whsec_ci
      AWS_S3_BUCKET_NAME: ci-bucket
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ci-key
      AWS_SECRET_ACCESS_KEY: ci-secret

      # The signup endpoints are exercised for real below; without this every one of them is
      # answered 403 by the reCAPTCHA guard and nothing underneath is ever reached.
      RECAPTCHA_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - run: npm ci

      # The TypeScript project references are derived from the dependency graph, and `typecheck`
      # refuses to run against stale ones. Checking it explicitly turns "the workspace is out of
      # sync" into a named failure instead of a confusing one inside the next step.
      - run: npx nx sync:check

      - run: npx nx run-many -t lint test build typecheck

      # Proves the translation tooling still agrees with the code it is checking.
      #
      # `no-hardcoded-strings.spec.ts` runs the extractor in report mode, so a literal that
      # reappears in a template fails the build. This step runs the extractor for real and fails
      # if it CHANGED anything — which is the other half: a tool that has drifted from the state
      # of the repository would report zero for the wrong reason.
      - name: i18n extraction is idempotent
        run: |
          node tools/i18n/externalize-template-text.mjs
          node tools/i18n/externalize-template-text.mjs --hbs
          node tools/i18n/extract-client-messages.mjs
          node tools/i18n/extract-backend-messages.mjs
          node tools/i18n/ensure-translate-imports.mjs
          git diff --exit-code || {
            echo '::error::The i18n extractors changed files. Run them locally and commit the result.'
            exit 1
          }

      # Proves the migrations and the entities describe the same schema. A missing migration is
      # invisible locally (where the schema was created by an earlier `synchronize`) and only
      # surfaces as a broken deploy; this turns it into a failing build.
      - run: npm run check:schema-drift

      # Proves that a tenant's fiscal identity survives storage, and that two distinct taxpayers
      # no longer collide on the unique index over (tax_id, fiscal_region_id). The failure this
      # guards is a database constraint firing on the second insert, which no unit test can show.
      - run: npm run verify:fiscal-identity

      # Proves multi-tenancy actually holds: one identity across tenants, per-tenant permissions,
      # and a tenant the user does not belong to refused.
      - run: npm run verify:tenancy

      # Proves the application can actually START. A build only proves the code compiles; a missing
      # provider, an unexported service, a module registered twice, or a constructor that throws on
      # a missing environment variable all compile cleanly and fail on deploy. Three such faults
      # were found the first time this ran: reCAPTCHA registered globally in two modules with
      # conflicting disable logic, a push-notification constructor that threw on an undeclared
      # VAPID key and took the whole process down with it, and `DB_SSL=false` enabling TLS because
      # the flag was never coerced from its string form.
      - run: npm run verify:boot

      # Proves every one of the nineteen markets can actually be provisioned, through the real
      # services rather than a fixture: a chart of accounts, its segment definitions, and the
      # consumption taxes the country's scheme calls for. A market that seeds nothing is a
      # customer with an ERP that cannot post a journal entry, and nothing else in the build
      # would notice.
      - run: npm run verify:markets

      # Proves that a PAID signup materialises a working tenant, end to end, for a representative
      # spread of fiscal regimes — ledger, roles, owner membership, plan, subscription, verified
      # fiscal identity — and that completing it twice yields one account rather than two. The
      # webhook and the browser redirect race each other on every real signup, so idempotency
      # here is not a nicety.
      - run: npm run verify:provisioning

      # Proves the authentication surface over real HTTP: cookie-only tokens with the lifetimes
      # they claim, CSRF enforced and rotated, refresh rotation, step-up refused without proof,
      # enumeration parity between a wrong password and an unknown mailbox, and a revoked session
      # dying immediately. This is what the Nx e2e placeholders were standing in for.
      - run: npm run verify:auth-contract

      - run: npx nx fix-ci
        if: always()
