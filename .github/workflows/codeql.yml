name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so new queries shipped with CodeQL are run against code nobody has touched.
    - cron: '22 20 * * 0'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload results
      packages: read # download CodeQL query packs
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
            # Records `// codeql[rule-id] reason` comments as suppressions on the results they
            # precede; the step before upload removes those results (see the script).
            packs: codeql/javascript-queries:AlertSuppression.ql

    steps:
      # Actions are pinned by commit (Dependabot keeps the pins current).
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          packs: ${{ matrix.packs }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}
          upload: never
          output: ${{ runner.temp }}/codeql-sarif

      # Code scanning ignores SARIF `suppressions`, so a result excused in source would still open
      # an alert. The script drops those results, lists every one in the job summary, and fails if
      # a suppression comment no longer matches anything.
      - name: Apply in-source suppressions
        run: node tools/ci/drop-suppressed-sarif-results.mjs "$RUNNER_TEMP/codeql-sarif"

      - name: Upload results
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}
