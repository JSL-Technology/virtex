name: Release images

# Builds the production images from a tag (v1.2.3) or on demand, and publishes them to GHCR:
#   ghcr.io/<owner>/<repo>/api:<tag>   the API (also runs the migrations)
#   ghcr.io/<owner>/<repo>/web:<tag>   Caddy with the ERP and the POS
# The frontend bundles carry deployment values, so they come from repository variables:
#   vars.PRODUCTION_API_URL, vars.RECAPTCHA_V3_SITE_KEY, vars.VAPID_PUBLIC_KEY (optional).
# Deploying is `IMAGE_TAG=<tag> docker compose -f deploy/docker-compose.prod.yml pull && up -d`.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag'
        required: true
        default: 'manual'

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tag
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.target }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ steps.tag.outputs.image }}:${{ steps.tag.outputs.tag }}
            ${{ steps.tag.outputs.image }}:latest
          build-args: |
            API_URL=${{ vars.PRODUCTION_API_URL }}
            RECAPTCHA_V3_SITE_KEY=${{ vars.RECAPTCHA_V3_SITE_KEY }}
            VAPID_PUBLIC_KEY=${{ vars.VAPID_PUBLIC_KEY }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
